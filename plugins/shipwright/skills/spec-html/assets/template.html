<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<style>
  :root {
    --bg: #ffffff; --fg: #1a1a1a; --muted: #6b7280; --border: #e5e7eb;
    --accent: #0969da; --code-bg: #f6f8fa; --nav-bg: #fafafa;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --fg: #e6edf3; --muted: #8b949e; --border: #30363d;
      --accent: #58a6ff; --code-bg: #161b22; --nav-bg: #010409;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: grid; grid-template-columns: 260px 1fr;
  }
  nav {
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
    background: var(--nav-bg); border-right: 1px solid var(--border);
    padding: 1.5rem 1rem; font-size: 0.875rem;
  }
  nav .doc-title { font-weight: 700; margin-bottom: 1rem; font-size: 0.95rem; }
  nav a {
    display: block; color: var(--muted); text-decoration: none;
    padding: 0.2rem 0.5rem; border-left: 2px solid transparent; border-radius: 0 4px 4px 0;
  }
  nav a.h3 { padding-left: 1.4rem; font-size: 0.83rem; }
  nav a:hover { color: var(--fg); }
  nav a.active { color: var(--accent); border-left-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
  main { padding: 2.5rem 3rem 6rem; min-width: 0; }
  main > * { max-width: 70ch; }
  main > pre, main > table, main > .mermaid-box { max-width: 100%; }
  h1, h2, h3 { line-height: 1.3; scroll-margin-top: 1rem; }
  h1 { font-size: 1.9rem; border-bottom: 1px solid var(--border); padding-bottom: 0.4rem; }
  h2 { font-size: 1.4rem; margin-top: 2.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.3rem; }
  h3 { font-size: 1.15rem; margin-top: 1.8rem; }
  a { color: var(--accent); }
  code { background: var(--code-bg); padding: 0.15em 0.35em; border-radius: 4px; font-size: 0.875em; }
  pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; overflow-x: auto; }
  pre code { background: none; padding: 0; }
  table { border-collapse: collapse; display: block; overflow-x: auto; }
  th, td { border: 1px solid var(--border); padding: 0.45rem 0.8rem; text-align: left; }
  th { background: var(--code-bg); }
  blockquote { margin: 1rem 0; padding: 0.2rem 1rem; border-left: 3px solid var(--accent); color: var(--muted); }
  .mermaid-box { background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; margin: 1.5rem 0; overflow-x: auto; }
  .mermaid-box svg { display: block; margin: 0 auto; max-width: 100%; }
  hr { border: none; border-top: 1px solid var(--border); margin: 2rem 0; }
  @media (max-width: 900px) {
    body { grid-template-columns: 1fr; }
    nav { position: static; height: auto; border-right: none; border-bottom: 1px solid var(--border); }
    main { padding: 1.5rem 1.2rem 4rem; }
  }
</style>
</head>
<body>
<nav id="toc"><div class="doc-title">{{TITLE}}</div></nav>
<main id="content"></main>
<script type="text/markdown" id="source">{{MARKDOWN}}</script>
<script>
  const dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  mermaid.initialize({ startOnLoad: false, theme: dark ? "dark" : "default" });

  const src = document.getElementById("source").textContent;
  const main = document.getElementById("content");
  main.innerHTML = marked.parse(src, { mangle: false, headerIds: false });

  // Mermaid blocks: marked renders them as <pre><code class="language-mermaid">
  document.querySelectorAll("code.language-mermaid").forEach((code, i) => {
    const box = document.createElement("div");
    box.className = "mermaid-box";
    const el = document.createElement("pre");
    el.className = "mermaid";
    el.textContent = code.textContent;
    box.appendChild(el);
    code.closest("pre").replaceWith(box);
  });
  mermaid.run({ querySelector: ".mermaid" });

  // TOC from h2/h3 with scroll-spy
  const toc = document.getElementById("toc");
  const slug = t => t.toLowerCase().replace(/[^\w\s-]/g, "").trim().replace(/\s+/g, "-");
  const links = new Map();
  main.querySelectorAll("h2, h3").forEach(h => {
    if (!h.id) h.id = slug(h.textContent) || "s" + links.size;
    const a = document.createElement("a");
    a.href = "#" + h.id;
    a.textContent = h.textContent;
    if (h.tagName === "H3") a.className = "h3";
    toc.appendChild(a);
    links.set(h.id, a);
  });
  const spy = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        links.forEach(a => a.classList.remove("active"));
        links.get(e.target.id)?.classList.add("active");
      }
    });
  }, { rootMargin: "0px 0px -75% 0px" });
  links.forEach((_, id) => spy.observe(document.getElementById(id)));
</script>
</body>
</html>
