name: windows-suite

on:
  push:
    branches: [feat/portable-suite]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suite:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - run: bash plugins/zuko/scripts/tests/run.sh
